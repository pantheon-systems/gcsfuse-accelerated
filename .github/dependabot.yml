# This file is managed by github-terraform. Manual changes will be overwritten.
# To modify it, edit orgs/pantheon-systems/files/dependabot/custom/gcsfuse-accelerated.yml
# in https://github.com/pantheon-systems/github-terraform
version: 2
enable-beta-ecosystems: true
updates:
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: gomod
  directory: "/"
  allow:
  - dependency-type: "direct"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: pip
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
    day: "sunday"
    time: "06:00"
    timezone: "UTC"
  cooldown:
    default-days: 3
  open-pull-requests-limit: 5
  groups:
    actions:
      applies-to: version-updates
      patterns: ["*"]
      update-types: ["minor", "patch"]
    actions-security:
      applies-to: security-updates
      patterns: ["*"]
  commit-message:
    prefix: "chore"
    include: "scope"
  rebase-strategy: "auto"
